apiVersion: v1
kind: Service
metadata:
  name: mirror-web
  namespace: api-mirror
spec:
  selector: { app: mirror-web }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirror-web
  namespace: api-mirror
spec:
  replicas: 2
  selector:
    matchLabels: { app: mirror-web }
  template:
    metadata:
      labels: { app: mirror-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/mirror-web:latest
          ports: [{ containerPort: 8080, name: http }]
          env:
            - name: API_UPSTREAM
              valueFrom: { configMapKeyRef: { name: mirror-config, key: API_UPSTREAM } }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
