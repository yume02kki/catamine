apiVersion: v1
kind: Service
metadata:
  name: mirror-postgres
  namespace: api-mirror
spec:
  selector: { app: mirror-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mirror-postgres
  namespace: api-mirror
spec:
  serviceName: mirror-postgres
  replicas: 1
  selector:
    matchLabels: { app: mirror-postgres }
  template:
    metadata:
      labels: { app: mirror-postgres }
    spec:
      securityContext:
        fsGroup: 70            # postgres user in the alpine image
      containers:
        - name: postgres
          image: postgres:17-alpine
          args: ["-c", "shared_buffers=1GB", "-c", "max_wal_size=8GB", "-c", "checkpoint_timeout=15min", "-c", "effective_cache_size=3GB"]
          env:
            - { name: POSTGRES_DB, value: mirror }
            - { name: POSTGRES_USER, value: mirror }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: mirror-secrets, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432, name: postgres }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "mirror", "-d", "mirror"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "mirror", "-d", "mirror"] }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 4Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 100Gi }
