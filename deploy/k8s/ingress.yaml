# Example: one host for the UI/api, one for proxied traffic. Adjust hosts and class to your cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mirror
  namespace: api-mirror
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"       # SSE
    nginx.ingress.kubernetes.io/proxy-body-size: "0"         # imports / large proxied bodies
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: mirror.example.internal
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: mirror-web, port: { number: 8080 } } } }
    - host: proxy.example.internal
      http:
        paths:
          - { path: /m, pathType: Prefix, backend: { service: { name: mirror-proxy, port: { number: 8080 } } } }
